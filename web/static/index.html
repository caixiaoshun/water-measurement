        <span style="color:#1a9fff;">&#9632;</span> 蓝色动态水面 = 真实水面（含水位高度）<br>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── Coordinate helpers ─────────────────────────────────────────────────────
// World convention: X right, Y depth (forward), Z up
// Three.js convention: X right, Y up, Z toward viewer
// Mapping: world(wx,wy,wz) -> three(wx, wz, -wy)
function w2t(wx, wy, wz) { return new THREE.Vector3(wx, wz, -wy); }
function w2tv(arr) { return w2t(arr[0], arr[1], arr[2]); }

// ── Renderer ───────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const canvas3   = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas: canvas3, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;

// CSS2D label renderer (appended on top of the WebGL canvas)
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position     = 'absolute';
labelRenderer.domElement.style.top          = '0';
labelRenderer.domElement.style.left         = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

// ── Scene ──────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

const viewCam = new THREE.PerspectiveCamera(55, 1, 0.05, 2000);
viewCam.position.set(14, 10, 14);
viewCam.lookAt(0, 2, -8);

const controls = new OrbitControls(viewCam, renderer.domElement);
controls.target.set(0, 2, -8);
controls.enableDamping  = true;
controls.dampingFactor  = 0.08;
controls.minDistance    = 1;
controls.maxDistance    = 500;

// ── Sky ────────────────────────────────────────────────────────────────────
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);

const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value        = 8;
skyUniforms['rayleigh'].value         = 1.5;
skyUniforms['mieCoefficient'].value   = 0.005;
skyUniforms['mieDirectionalG'].value  = 0.8;

const sun = new THREE.Vector3();
const phi   = THREE.MathUtils.degToRad(87);   // sun near horizon
const theta = THREE.MathUtils.degToRad(200);
sun.setFromSphericalCoords(1, phi, theta);
skyUniforms['sunPosition'].value.copy(sun);

// ── Lighting ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff0d0, 0.7));
const dLight = new THREE.DirectionalLight(0xfff8e1, 1.4);
dLight.position.set(30, 60, 20);
scene.add(dLight);

// ── Water surface (created once, repositioned when water level changes) ────
const _waterGeometry = new THREE.PlaneGeometry(400, 400);
const waterMesh = new Water(_waterGeometry, {
  textureWidth:    512,
  textureHeight:   512,
  waterNormals: new THREE.TextureLoader().load(
    '/static/three/textures/waternormals.jpg',
    tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  ),
  sunDirection: sun.clone().normalize(),
  sunColor:       0xffffff,
  waterColor:     0x001e3c,
  distortionScale: 3.2,
  fog: false,
});
waterMesh.rotation.x = -Math.PI / 2;
waterMesh.position.y  = 0;
scene.add(waterMesh);

// ── World origin axes ──────────────────────────────────────────────────────
const axes = new THREE.AxesHelper(3);
axes.position.y = 0.03;
scene.add(axes);

// ── Resize handler ─────────────────────────────────────────────────────────
function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  viewCam.aspect = w / h;
  viewCam.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe(container);
onResize();

// ── Scene object groups ────────────────────────────────────────────────────
let cameraGroup  = new THREE.Group();
let measureGroup = new THREE.Group();
scene.add(cameraGroup, measureGroup);

// ── Camera fly-to animation ────────────────────────────────────────────────
const FLY_DURATION_S = 1.3;
let flyFrom    = null;
let flyTarget  = null;
let flyT       = 1.0;
let flyStart   = 0;

function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function startFly(toPos, toTarget) {
  flyFrom   = { pos: viewCam.position.clone(), target: controls.target.clone() };
  flyTarget = { pos: toPos, target: toTarget };
  flyT      = 0.0;
  flyStart  = performance.now();
}

// ── Render loop ────────────────────────────────────────────────────────────
(function animate(time) {
  requestAnimationFrame(animate);

  // Animate water surface
  waterMesh.material.uniforms['time'].value += 1.0 / 60.0;

  // Camera fly animation
  if (flyT < 1.0) {
    flyT = Math.min((performance.now() - flyStart) / (FLY_DURATION_S * 1000), 1.0);
    const t = easeInOut(flyT);
    viewCam.position.lerpVectors(flyFrom.pos, flyTarget.pos, t);
    controls.target.lerpVectors(flyFrom.target, flyTarget.target, t);
  }

  controls.update();
  renderer.render(scene, viewCam);
  labelRenderer.render(scene, viewCam);
})();

// ── Camera model (frustum wire + body mesh + glow sphere) ─────────────────
function buildCameraModel(cw, R) {
  // Column vectors of R^T give camera axes in world coords
  const zw = [R[0][2], R[1][2], R[2][2]];   // optical axis (forward)
  const xw = [R[0][0], R[1][0], R[2][0]];   // right
  const yw = [R[0][1], R[1][1], R[2][1]];   // down (camera Y)

  const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
  const mul = (a, s) => [a[0]*s, a[1]*s, a[2]*s];

  const depth = 3.0, fH = 1.2, fV = 0.7;
  const front   = add(cw, mul(zw, depth));
  const corners = [
    add(add(front,  mul(xw,  fH)), mul(yw,  fV)),
    add(add(front,  mul(xw, -fH)), mul(yw,  fV)),
    add(add(front,  mul(xw, -fH)), mul(yw, -fV)),
    add(add(front,  mul(xw,  fH)), mul(yw, -fV)),
  ];

  // Frustum wireframe
  const pts = [];
  for (const c of corners)  { pts.push(w2tv(cw), w2tv(c)); }
  for (let i = 0; i < 4; i++) { pts.push(w2tv(corners[i]), w2tv(corners[(i+1)%4])); }
  pts.push(w2tv(cw), w2tv(add(cw, mul(zw, depth * 1.5))));
  const frustum = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0xffd700 })
  );

  // Camera body (box)
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.3, 0.75),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.55, metalness: 0.5 })
  );

  // Lens (cylinder)
  const lens = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.17, 0.38, 20),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.08, metalness: 0.9 })
  );
  lens.rotation.x = Math.PI / 2;
  lens.position.z = 0.55;

  // Glow sphere marking camera centre
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 18, 12),
    new THREE.MeshStandardMaterial({
      color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.6, roughness: 0.25
    })
  );

  // Orient body/lens along the camera optical axis (world Z direction -> three Z direction)
  const zwT = new THREE.Vector3(zw[0], zw[2], -zw[1]).normalize();
  const upT  = new THREE.Vector3(0, 1, 0);
  if (Math.abs(zwT.dot(upT)) > 0.999) upT.set(1, 0, 0);
  const bodyObj = new THREE.Group();
  bodyObj.add(body, lens);
  bodyObj.quaternion.setFromRotationMatrix(
    new THREE.Matrix4().lookAt(new THREE.Vector3(), zwT, upT)
  );
  bodyObj.position.copy(w2tv(cw));
  sphere.position.copy(w2tv(cw));

  const grp = new THREE.Group();
  grp.add(frustum, bodyObj, sphere);
  return grp;
}

// ── Glowing line ───────────────────────────────────────────────────────────
function makeGlowLine(a, b, color) {
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a, b]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending })
  );
}

// ── Ripple / glow marker at a water intersection point ─────────────────────
function makeRippleMarker(pos, color) {
  const grp = new THREE.Group();
  grp.position.copy(pos);

  // Glow sphere
  grp.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 18, 12),
    new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: 1.1, transparent: true, opacity: 0.92
    })
  ));

  // Two concentric rings lying flat on the water
  for (const r of [0.38, 0.62]) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(r, r + 0.045, 36),
      new THREE.MeshBasicMaterial({
        color, side: THREE.DoubleSide, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending
      })
    );
    ring.rotation.x = -Math.PI / 2;
    grp.add(ring);
  }
  return grp;
}

// ── Full measurement visualisation ─────────────────────────────────────────
function buildMeasurement(cc, p1, p2, distM) {
  const g    = new THREE.Group();
  const cpv  = w2tv(cc);
  const p1v  = w2tv(p1);
  const p2v  = w2tv(p2);

  // Rays: tech-blue glow from camera to water intersections
  g.add(makeGlowLine(cpv, p1v, 0x00aaff));
  g.add(makeGlowLine(cpv, p2v, 0x00aaff));

  // Measurement baseline: orange glow
  g.add(makeGlowLine(p1v, p2v, 0xff8800));

  // Ripple markers at intersection points
  g.add(makeRippleMarker(p1v, 0xf78166));
  g.add(makeRippleMarker(p2v, 0x3fb950));

  // CSS2D floating distance label at midpoint (only when we have a real result)
  if (distM != null) {
    const mid = new THREE.Vector3().addVectors(p1v, p2v).multiplyScalar(0.5);
    mid.y += 0.8;
    const div = document.createElement('div');
    div.className   = 'label-dist';
    div.textContent = distM.toFixed(3) + ' m';
    const lbl = new CSS2DObject(div);
    lbl.position.copy(mid);
    g.add(lbl);
  }

  return g;
}

// ── Update scene state ─────────────────────────────────────────────────────
function updateScene(data, distM) {
  const wl = data.water_level_m != null ? data.water_level_m : 0;

  // Smoothly raise/lower water (just reposition the single Water mesh)
  waterMesh.position.y = wl;

  // Camera frustum + model
  scene.remove(cameraGroup);
  cameraGroup = new THREE.Group();
  if (data.camera_center_world && data.camera_pose_R) {
    cameraGroup = buildCameraModel(data.camera_center_world, data.camera_pose_R);
  }
  scene.add(cameraGroup);

  // Measurement rays & labels
  // Explicitly remove old CSS2D label DOM elements before replacing the group
  measureGroup.traverse(obj => {
    if (obj.isCSS2DObject && obj.element.parentNode) obj.element.remove();
  });
  scene.remove(measureGroup);
  measureGroup = new THREE.Group();
  if (data.point1_world && data.point2_world && data.camera_center_world) {
    measureGroup = buildMeasurement(
      data.camera_center_world, data.point1_world, data.point2_world, distM
    );
  }
  scene.add(measureGroup);

  // Fly viewer camera to a good vantage point for this scene
  if (data.camera_center_world) {
    const cc = w2tv(data.camera_center_world);
    const focus = (data.point1_world && data.point2_world)
      ? new THREE.Vector3().addVectors(w2tv(data.point1_world), w2tv(data.point2_world)).multiplyScalar(0.5)
      : new THREE.Vector3(cc.x, 0, cc.z);
    const span = Math.max(cc.distanceTo(focus) * 1.6, 12);
    startFly(
      new THREE.Vector3(focus.x + span * 0.55, Math.max(cc.y + span * 0.35, 4), focus.z + span * 0.55),
      focus
    );
  }
}

// ── Reset to default scene ─────────────────────────────────────────────────
function resetScene() {
  waterMesh.position.y = 0;
  measureGroup.traverse(obj => {
    if (obj.isCSS2DObject && obj.element.parentNode) obj.element.remove();
  });
  scene.remove(cameraGroup, measureGroup);
  cameraGroup  = new THREE.Group();
  measureGroup = new THREE.Group();
  scene.add(cameraGroup, measureGroup);
  startFly(new THREE.Vector3(14, 10, 14), new THREE.Vector3(0, 2, -8));
}

// ── Result panel ───────────────────────────────────────────────────────────
function updateResultPanel(mr, expectedDist, relError, passed) {
  const dv = document.getElementById('dist-value');
  if (mr.success && mr.distance_m != null) {
    dv.textContent = mr.distance_m.toFixed(3) + ' m';
    dv.style.color = '#f78166';
    document.getElementById('dist-meta').textContent = mr.message;
  } else {
    dv.textContent = '测量失败';
    dv.style.color = '#8b949e';
    document.getElementById('dist-meta').textContent = mr.message || '';
  }
  document.getElementById('d-conf').textContent =
    mr.confidence != null ? mr.confidence.toFixed(3) : '—';
  document.getElementById('d-time').textContent =
    mr.elapsed_ms != null ? mr.elapsed_ms.toFixed(2) + ' ms' : '—';
  const graz = (mr.diagnostics || {}).grazing;
  document.getElementById('d-graz').textContent =
    graz ? graz.map(g => g.toFixed(4)).join(', ') : '—';
  document.getElementById('d-stat').textContent = mr.message || '—';
  document.getElementById('d-wl').textContent =
    mr.water_level_m != null ? mr.water_level_m.toFixed(2) + ' m' : '—';

  let html = '';
  if (passed === true) {
    html = `<span class="result-badge result-pass">&#10003; 通过${relError != null ? ' (误差 ' + (relError * 100).toFixed(2) + '%)' : ''}</span>`;
  } else if (passed === false) {
    html = `<span class="result-badge result-fail">&#10007; 未通过${relError != null ? ' (误差 ' + (relError * 100).toFixed(2) + '%)' : ''}</span>`;
  } else if (passed === null && expectedDist == null) {
    html = '<span class="result-badge result-info">退化场景（预期失败）</span>';
  }
  if (expectedDist != null) {
    html += `<div style="font-size:0.72rem;color:#8b949e;margin-top:4px;">期望: ${expectedDist.toFixed(3)} m</div>`;
  }
  document.getElementById('result-badge-area').innerHTML = html;
}

// ── Test cases ─────────────────────────────────────────────────────────────
let tcCache = [];

async function loadTestCases() {
  try {
    const r = await fetch('/test_cases');
    tcCache  = await r.json();
    const el = document.getElementById('tc-list');
    el.innerHTML = tcCache.map(tc =>
      `<div class="tc-item" data-id="${tc.id}">
        <div class="tc-name">${tc.name}</div>
        <div class="tc-cat">${tc.category}</div>
        <div class="tc-tags">${tc.tags.map(t => `<span class="tc-tag">${t}</span>`).join('')}</div>
      </div>`
    ).join('');
    el.querySelectorAll('.tc-item').forEach(item => {
      item.addEventListener('click', () => selectTestCase(item.dataset.id));
    });
  } catch (e) {
    document.getElementById('tc-list').innerHTML =
      `<div style="color:#f78166;font-size:0.75rem;">加载失败: ${e.message}</div>`;
  }
}

async function selectTestCase(id) {
  document.querySelectorAll('.tc-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id)
  );
  const tc     = tcCache.find(t => t.id === id);
  const descEl = document.getElementById('tc-desc');
  if (tc) { descEl.textContent = tc.description; descEl.style.display = 'block'; }
  document.getElementById('status-line').textContent = '正在运行测试用例…';
  try {
    const r = await fetch('/test_cases/' + encodeURIComponent(id) + '/run',
      { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const d  = await r.json();
    const mr = d.measure_result;
    updateScene(
      { camera_center_world: mr.camera_center_world, camera_pose_R: mr.camera_pose_R,
        point1_world: mr.point1_world, point2_world: mr.point2_world,
        water_level_m: mr.water_level_m },
      mr.success ? mr.distance_m : null
    );
    updateResultPanel(mr, d.expected_distance_m, d.relative_error, d.passed);
    document.getElementById('status-line').textContent = '已加载: ' + d.name;
  } catch (e) {
    document.getElementById('status-line').textContent = '运行失败: ' + e.message;
  }
}

// ── Manual measure button ──────────────────────────────────────────────────
document.getElementById('btn-measure').addEventListener('click', async () => {
  const x1 = parseFloat(document.getElementById('px1-x').value);
  const y1 = parseFloat(document.getElementById('px1-y').value);
  const x2 = parseFloat(document.getElementById('px2-x').value);
  const y2 = parseFloat(document.getElementById('px2-y').value);
  if ([x1, y1, x2, y2].some(isNaN)) {
    document.getElementById('status-line').textContent = '请填写完整的像素坐标';
    return;
  }
  const wl = parseFloat(document.getElementById('wl-input').value) || 0;
  document.getElementById('status-line').textContent = '测量中…';
  try {
    const r = await fetch('/measure', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ point1: { x: x1, y: y1 }, point2: { x: x2, y: y2 }, water_level_m: wl })
    });
    const d = await r.json();
    updateScene(
      { camera_center_world: d.camera_center_world, camera_pose_R: d.camera_pose_R,
        point1_world: d.point1_world, point2_world: d.point2_world,
        water_level_m: d.water_level_m },
      d.success ? d.distance_m : null
    );
    updateResultPanel(d, null, null, null);
    document.getElementById('status-line').textContent = '手动测量完成';
  } catch (e) {
    document.getElementById('status-line').textContent = '请求失败: ' + e.message;
  }
});

// ── Reset button ───────────────────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  resetScene();
  document.querySelectorAll('.tc-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tc-desc').style.display = 'none';
  ['dist-value', 'dist-meta', 'result-badge-area', 'd-conf', 'd-time', 'd-graz', 'd-stat', 'd-wl'].forEach(id => {
    document.getElementById(id).innerHTML = id === 'dist-value' ? '&#8212;' : '';
  });
  document.getElementById('status-line').textContent = '场景已重置';
});

// ── Health check ───────────────────────────────────────────────────────────
async function checkHealth() {
  const b = document.getElementById('health-badge');
  try {
    const d = await (await fetch('/health')).json();
    if (d.status === 'ok') {
      b.textContent = '&#9679; 系统在线'; b.style.background = '#1f4d2b'; b.style.color = '#3fb950';
    } else {
      b.textContent = '&#9675; 异常'; b.style.background = '#4d1f1f'; b.style.color = '#f78166';
    }
  } catch {
    b.textContent = '&#9675; 离线'; b.style.background = '#4d1f1f'; b.style.color = '#f78166';
  }
}

loadTestCases();
checkHealth();
setInterval(checkHealth, 15000);
</script>
