<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水面视觉测距系统 3D 演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0d1117; color: #e6edf3; display: flex; flex-direction: column;
         min-height: 100vh; overflow: hidden; }
  header { background: #161b22; padding: 12px 20px; display: flex;
           align-items: center; gap: 12px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  header h1 { font-size: 1.1rem; font-weight: 600; color: #58a6ff; }
  header .badge { background: #1f6feb; padding: 2px 10px; border-radius: 12px;
                  font-size: 0.72rem; color: #cae8ff; }
  header .health { font-size: 0.75rem; padding: 2px 10px; border-radius: 12px;
                   background: #1c2128; color: #8b949e; transition: all 0.3s; }
  .main { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 49px); }
  #canvas-container { flex: 1; position: relative; background: #0d1117; overflow: hidden; }
  #three-canvas { width: 100%; height: 100%; display: block; }
  .canvas-hint { position: absolute; bottom: 12px; left: 12px; font-size: 0.72rem;
                 color: rgba(139,148,158,0.8); pointer-events: none;
                 background: rgba(13,17,23,0.7); padding: 4px 10px; border-radius: 6px; }
  .sidebar { width: 320px; background: #161b22; border-left: 1px solid #30363d;
             overflow-y: auto; display: flex; flex-direction: column; gap: 0; flex-shrink: 0; }
  .card { background: #0d1117; border-bottom: 1px solid #21262d; padding: 14px 16px; }
  .card h3 { font-size: 0.78rem; font-weight: 600; color: #8b949e; text-transform: uppercase;
             letter-spacing: 0.06em; margin-bottom: 10px; }
  .dist-value { font-size: 2rem; font-weight: 700; color: #f78166; line-height: 1; }
  .dist-meta { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }
  .info-row { display: flex; justify-content: space-between; font-size: 0.78rem;
              padding: 4px 0; border-bottom: 1px solid #21262d; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #8b949e; }
  .info-value { color: #e6edf3; font-weight: 500; }
  .water-input { display: flex; gap: 8px; align-items: center; }
  .water-input label { font-size: 0.82rem; color: #8b949e; }
  .water-input input { width: 80px; padding: 6px 8px; border-radius: 6px;
                       border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.82rem; }
  .water-input input:focus { outline: none; border-color: #58a6ff; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
         padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: background 0.15s; }
  .btn:hover { background: #30363d; }
  .btn-primary { background: #1f6feb; border-color: #1f6feb; }
  .btn-primary:hover { background: #388bfd; }
  .status-line { font-size: 0.75rem; color: #8b949e; padding: 6px 0 0; }
  .tc-list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .tc-item { background: #21262d; border: 1px solid #30363d; border-radius: 6px;
             padding: 8px 10px; cursor: pointer; transition: all 0.15s; }
  .tc-item:hover { border-color: #58a6ff; background: #1c2128; }
  .tc-item.active { border-color: #58a6ff; background: #1c2128; }
  .tc-name { font-size: 0.8rem; font-weight: 600; color: #e6edf3; }
  .tc-cat { font-size: 0.68rem; color: #8b949e; margin-top: 1px; }
  .tc-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }
  .tc-tag { font-size: 0.63rem; background: #0d1117; color: #58a6ff;
            border: 1px solid #1f6feb; padding: 1px 6px; border-radius: 10px; }
  .result-badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
                  font-size: 0.73rem; font-weight: 600; margin-bottom: 6px; }
  .result-pass { background: #1f4d2b; color: #3fb950; }
  .result-fail { background: #4d1f1f; color: #f78166; }
  .result-info { background: #1c2128; color: #8b949e; }
  .desc-text { font-size: 0.72rem; color: #8b949e; line-height: 1.5; margin-top: 8px; }
  .px-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .px-label { font-size: 0.72rem; color: #8b949e; margin-bottom: 2px; }
  .px-input { width: 100%; padding: 5px 6px; border-radius: 4px; border: 1px solid #30363d;
              background: #0d1117; color: #e6edf3; font-size: 0.78rem; margin-bottom: 4px; }
  .px-input:focus { outline: none; border-color: #58a6ff; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>&#128167; 水面视觉测距系统</h1>
  <span class="badge">3D 可视化演示</span>
  <div style="flex:1"></div>
  <span class="health" id="health-badge">检测中&#8230;</span>
</header>

<div class="main">
  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>
    <div class="canvas-hint">拖拽旋转 &middot; 滚轮缩放 &middot; 右键平移</div>
  </div>

  <div class="sidebar">
    <!-- 测试用例面板 -->
    <div class="card">
      <h3>测试用例可视化</h3>
      <div class="tc-list" id="tc-list"><div style="color:#8b949e;font-size:0.75rem;">加载中&#8230;</div></div>
      <div id="tc-desc" class="desc-text" style="display:none;"></div>
    </div>

    <!-- 测距结果 -->
    <div class="card">
      <h3>测距结果</h3>
      <div class="dist-value" id="dist-value">&#8212;</div>
      <div class="dist-meta" id="dist-meta"></div>
      <div id="result-badge-area" style="margin-top:8px;"></div>
    </div>

    <!-- 诊断信息 -->
    <div class="card">
      <h3>诊断信息</h3>
      <div class="info-row"><span class="info-label">置信度</span><span class="info-value" id="d-conf">&#8212;</span></div>
      <div class="info-row"><span class="info-label">耗时</span><span class="info-value" id="d-time">&#8212;</span></div>
      <div class="info-row"><span class="info-label">入射角余弦</span><span class="info-value" id="d-graz">&#8212;</span></div>
      <div class="info-row"><span class="info-label">系统状态</span><span class="info-value" id="d-stat">&#8212;</span></div>
      <div class="info-row"><span class="info-label">水位 (m)</span><span class="info-value" id="d-wl">&#8212;</span></div>
    </div>

    <!-- 水位参数 -->
    <div class="card">
      <h3>水位参数（手动测量）</h3>
      <div class="water-input">
        <label for="wl-input">h (m):</label>
        <input type="number" id="wl-input" value="0.0" step="0.1" min="-10" max="50">
      </div>
    </div>

    <!-- 手动测量 -->
    <div class="card">
      <h3>手动测量</h3>
      <div class="px-grid">
        <div>
          <div class="px-label">点 1 像素坐标</div>
          <input type="number" class="px-input" id="px1-x" placeholder="X">
          <input type="number" class="px-input" id="px1-y" placeholder="Y">
        </div>
        <div>
          <div class="px-label">点 2 像素坐标</div>
          <input type="number" class="px-input" id="px2-x" placeholder="X">
          <input type="number" class="px-input" id="px2-y" placeholder="Y">
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="btn-measure">开始测量</button>
        <button class="btn" id="btn-reset">重置场景</button>
      </div>
      <div class="status-line" id="status-line">请选择测试用例或输入像素坐标</div>
    </div>

    <!-- 说明 -->
    <div class="card">
      <h3>图例说明</h3>
      <div style="font-size:0.72rem;color:#8b949e;line-height:1.8;">
        <span style="color:#ffd700;">&#9632;</span> 金色视锥体 = 相机位置与姿态<br>
        <span style="color:#1a5f7a;">&#9632;</span> 蓝绿平面 = 水面（含水位高度）<br>
        <span style="color:#f78166;">&#9632;</span> 红色射线 = 从相机到水面的 3D 光线<br>
        <span style="color:#e9a045;">&#9632;</span> 橙色连线 = 实际测量距离
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// World (X, Y_depth, Z_up) -> Three.js (X, Z_up, -Y_depth)
function w2t(wx, wy, wz) { return new THREE.Vector3(wx, wz, -wy); }
function w2tv(arr) { return w2t(arr[0], arr[1], arr[2]); }

// Scene setup
const container = document.getElementById('canvas-container');
const canvas3 = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0d1117, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1117, 100, 400);

const viewCam = new THREE.PerspectiveCamera(55, 1, 0.05, 1000);
viewCam.position.set(14, 10, 14);
viewCam.lookAt(0, 2, -8);

const controls = new OrbitControls(viewCam, renderer.domElement);
controls.target.set(0, 2, -8);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 300;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
dLight.position.set(10, 20, 10);
scene.add(dLight);

// World axes
const axes = new THREE.AxesHelper(3);
axes.position.y = 0.02;
scene.add(axes);

function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  viewCam.aspect = w / h;
  viewCam.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe(container);
onResize();

(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, viewCam); })();

// Scene groups
let waterGroup = new THREE.Group();
let cameraGroup = new THREE.Group();
let measureGroup = new THREE.Group();
scene.add(waterGroup, cameraGroup, measureGroup);

function buildWaterPlane(h) {
  const g = new THREE.Group();
  // Surface mesh
  const geo = new THREE.PlaneGeometry(80, 80);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1a5f7a, transparent: true, opacity: 0.5, side: THREE.DoubleSide, roughness: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = h;
  g.add(mesh);
  // Grid
  const grid = new THREE.GridHelper(80, 40, 0x1e7a9c, 0x1a4d5e);
  grid.position.y = h + 0.01;
  g.add(grid);
  return g;
}

function buildCameraFrustum(cw, R) {
  // R[row][col]: R[i][j] means R_ij
  // Camera optical axis in world = R^T[:,2] = [R[0][2], R[1][2], R[2][2]]
  const zw = [R[0][2], R[1][2], R[2][2]];
  const xw = [R[0][0], R[1][0], R[2][0]];
  const yw = [R[0][1], R[1][1], R[2][1]];
  const add = (a,b) => [a[0]+b[0],a[1]+b[1],a[2]+b[2]];
  const mul = (a,s) => [a[0]*s,a[1]*s,a[2]*s];
  const depth = 3.0, fH = 1.2, fV = 0.7;
  const front = add(cw, mul(zw, depth));
  const corners = [
    add(add(front, mul(xw, fH)), mul(yw, fV)),
    add(add(front, mul(xw, -fH)), mul(yw, fV)),
    add(add(front, mul(xw, -fH)), mul(yw, -fV)),
    add(add(front, mul(xw, fH)), mul(yw, -fV)),
  ];
  const pts = [];
  for (const c of corners) { pts.push(w2tv(cw), w2tv(c)); }
  for (let i = 0; i < 4; i++) { pts.push(w2tv(corners[i]), w2tv(corners[(i+1)%4])); }
  pts.push(w2tv(cw), w2tv(add(cw, mul(zw, depth * 1.4))));
  const fGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const fMat = new THREE.LineBasicMaterial({ color: 0xffd700 });
  const frustum = new THREE.LineSegments(fGeo, fMat);
  const spGeo = new THREE.SphereGeometry(0.25, 12, 8);
  const spMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.4 });
  const sp = new THREE.Mesh(spGeo, spMat);
  sp.position.copy(w2tv(cw));
  const grp = new THREE.Group();
  grp.add(frustum, sp);
  return grp;
}

function buildMeasurement(cc, p1, p2) {
  const g = new THREE.Group();
  const cpv = w2tv(cc), p1v = w2tv(p1), p2v = w2tv(p2);
  // Rays
  [[cpv, p1v], [cpv, p2v]].forEach(([a,b]) => {
    const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
    g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xf78166, transparent: true, opacity: 0.8 })));
  });
  // Intersection spheres
  const sGeo = new THREE.SphereGeometry(0.15, 12, 8);
  [{ pos: p1v, c: 0xf78166 }, { pos: p2v, c: 0x3fb950 }].forEach(({ pos, c }) => {
    const m = new THREE.Mesh(sGeo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.3 }));
    m.position.copy(pos);
    g.add(m);
  });
  // Distance line
  const dGeo = new THREE.BufferGeometry().setFromPoints([p1v, p2v]);
  g.add(new THREE.Line(dGeo, new THREE.LineBasicMaterial({ color: 0xe9a045 })));
  return g;
}

function updateScene(data) {
  const wl = data.water_level_m != null ? data.water_level_m : 0;
  scene.remove(waterGroup); waterGroup = buildWaterPlane(wl); scene.add(waterGroup);
  scene.remove(cameraGroup); cameraGroup = new THREE.Group();
  if (data.camera_center_world && data.camera_pose_R) {
    cameraGroup = buildCameraFrustum(data.camera_center_world, data.camera_pose_R);
  }
  scene.add(cameraGroup);
  scene.remove(measureGroup); measureGroup = new THREE.Group();
  if (data.point1_world && data.point2_world && data.camera_center_world) {
    measureGroup = buildMeasurement(data.camera_center_world, data.point1_world, data.point2_world);
  }
  scene.add(measureGroup);
}

function resetScene() {
  scene.remove(waterGroup, cameraGroup, measureGroup);
  waterGroup = buildWaterPlane(0);
  cameraGroup = new THREE.Group();
  measureGroup = new THREE.Group();
  scene.add(waterGroup, cameraGroup, measureGroup);
}
resetScene();

function updateResultPanel(mr, expectedDist, relError, passed) {
  const dv = document.getElementById('dist-value');
  if (mr.success && mr.distance_m != null) {
    dv.textContent = mr.distance_m.toFixed(3) + ' m';
    dv.style.color = '#f78166';
    document.getElementById('dist-meta').textContent = mr.message;
  } else {
    dv.textContent = '测量失败';
    dv.style.color = '#8b949e';
    document.getElementById('dist-meta').textContent = mr.message || '';
  }
  document.getElementById('d-conf').textContent = mr.confidence != null ? mr.confidence.toFixed(3) : '—';
  document.getElementById('d-time').textContent = mr.elapsed_ms != null ? mr.elapsed_ms.toFixed(2) + ' ms' : '—';
  const graz = (mr.diagnostics || {}).grazing;
  document.getElementById('d-graz').textContent = graz ? graz.map(g => g.toFixed(4)).join(', ') : '—';
  document.getElementById('d-stat').textContent = mr.message || '—';
  document.getElementById('d-wl').textContent = mr.water_level_m != null ? mr.water_level_m.toFixed(2) + ' m' : '—';
  let html = '';
  if (passed === true) {
    html = `<span class="result-badge result-pass">&#10003; 通过${relError != null ? ' (误差 ' + (relError*100).toFixed(2) + '%)' : ''}</span>`;
  } else if (passed === false) {
    html = `<span class="result-badge result-fail">&#10007; 未通过${relError != null ? ' (误差 ' + (relError*100).toFixed(2) + '%)' : ''}</span>`;
  } else if (passed === null && expectedDist == null) {
    html = '<span class="result-badge result-info">退化场景（预期失败）</span>';
  }
  if (expectedDist != null) {
    html += `<div style="font-size:0.72rem;color:#8b949e;margin-top:4px;">期望: ${expectedDist.toFixed(3)} m</div>`;
  }
  document.getElementById('result-badge-area').innerHTML = html;
}

// Test cases
let tcCache = [];
async function loadTestCases() {
  try {
    const r = await fetch('/test_cases');
    tcCache = await r.json();
    const el = document.getElementById('tc-list');
    el.innerHTML = tcCache.map(tc =>
      `<div class="tc-item" data-id="${tc.id}">
        <div class="tc-name">${tc.name}</div>
        <div class="tc-cat">${tc.category}</div>
        <div class="tc-tags">${tc.tags.map(t => `<span class="tc-tag">${t}</span>`).join('')}</div>
      </div>`
    ).join('');
    el.querySelectorAll('.tc-item').forEach(item => {
      item.addEventListener('click', () => selectTestCase(item.dataset.id));
    });
  } catch(e) {
    document.getElementById('tc-list').innerHTML = `<div style="color:#f78166;font-size:0.75rem;">加载失败: ${e.message}</div>`;
  }
}

async function selectTestCase(id) {
  document.querySelectorAll('.tc-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const tc = tcCache.find(t => t.id === id);
  const descEl = document.getElementById('tc-desc');
  if (tc) { descEl.textContent = tc.description; descEl.style.display = 'block'; }
  document.getElementById('status-line').textContent = '正在运行测试用例…';
  try {
    const r = await fetch('/test_cases/' + encodeURIComponent(id) + '/run', { method: 'POST', headers: {'Content-Type':'application/json'} });
    const d = await r.json();
    const mr = d.measure_result;
    updateScene({ camera_center_world: mr.camera_center_world, camera_pose_R: mr.camera_pose_R,
                  point1_world: mr.point1_world, point2_world: mr.point2_world, water_level_m: mr.water_level_m });
    updateResultPanel(mr, d.expected_distance_m, d.relative_error, d.passed);
    document.getElementById('status-line').textContent = '已加载: ' + d.name;
  } catch(e) {
    document.getElementById('status-line').textContent = '运行失败: ' + e.message;
  }
}

document.getElementById('btn-measure').addEventListener('click', async () => {
  const x1 = parseFloat(document.getElementById('px1-x').value);
  const y1 = parseFloat(document.getElementById('px1-y').value);
  const x2 = parseFloat(document.getElementById('px2-x').value);
  const y2 = parseFloat(document.getElementById('px2-y').value);
  if ([x1,y1,x2,y2].some(isNaN)) { document.getElementById('status-line').textContent = '请填写完整的像素坐标'; return; }
  const wl = parseFloat(document.getElementById('wl-input').value) || 0;
  document.getElementById('status-line').textContent = '测量中…';
  try {
    const r = await fetch('/measure', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ point1:{x:x1,y:y1}, point2:{x:x2,y:y2}, water_level_m:wl }) });
    const d = await r.json();
    updateScene({ camera_center_world:d.camera_center_world, camera_pose_R:d.camera_pose_R,
                  point1_world:d.point1_world, point2_world:d.point2_world, water_level_m:d.water_level_m });
    updateResultPanel(d, null, null, null);
    document.getElementById('status-line').textContent = '手动测量完成';
  } catch(e) {
    document.getElementById('status-line').textContent = '请求失败: ' + e.message;
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  resetScene();
  document.querySelectorAll('.tc-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tc-desc').style.display = 'none';
  ['dist-value','dist-meta','result-badge-area','d-conf','d-time','d-graz','d-stat','d-wl'].forEach(id => {
    document.getElementById(id).innerHTML = id === 'dist-value' ? '&#8212;' : '';
  });
  document.getElementById('status-line').textContent = '场景已重置';
});

async function checkHealth() {
  const b = document.getElementById('health-badge');
  try {
    const d = await (await fetch('/health')).json();
    if (d.status === 'ok') {
      b.textContent = '&#9679; 系统在线'; b.style.background = '#1f4d2b'; b.style.color = '#3fb950';
    } else {
      b.textContent = '&#9675; 异常'; b.style.background = '#4d1f1f'; b.style.color = '#f78166';
    }
  } catch {
    b.textContent = '&#9675; 离线'; b.style.background = '#4d1f1f'; b.style.color = '#f78166';
  }
}

loadTestCases();
checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
