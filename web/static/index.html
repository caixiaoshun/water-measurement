<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Measurement Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #1a1a2e; color: #eee; display: flex; flex-direction: column;
         min-height: 100vh; }
  header { background: #16213e; padding: 14px 24px; display: flex;
           align-items: center; gap: 12px; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header .badge { background: #0f3460; padding: 3px 10px; border-radius: 12px;
                  font-size: 0.75rem; }
  .main { display: flex; flex: 1; gap: 0; }
  .canvas-area { flex: 1; position: relative; display: flex;
                 align-items: center; justify-content: center; padding: 16px; }
  canvas { border: 2px solid #334; cursor: crosshair; background: #222;
           max-width: 100%; }
  .sidebar { width: 340px; background: #16213e; padding: 20px;
             overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #0f3460; border-radius: 8px; padding: 14px; }
  .card h3 { font-size: 0.9rem; margin-bottom: 8px; color: #a8b8d8; }
  .card .value { font-size: 1.6rem; font-weight: 700; color: #e94560; }
  .card .meta { font-size: 0.78rem; color: #8899bb; margin-top: 6px; }
  .info-row { display: flex; justify-content: space-between; font-size: 0.82rem;
              padding: 3px 0; border-bottom: 1px solid #1a2a4a; }
  .info-row:last-child { border-bottom: none; }
  button { background: #e94560; color: #fff; border: none; padding: 10px 18px;
           border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #d63a52; }
  button.secondary { background: #334; }
  button.secondary:hover { background: #445; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .status { font-size: 0.8rem; color: #7a9; padding: 6px 0; }
  .water-input { display: flex; gap: 8px; align-items: center; }
  .water-input input { width: 80px; padding: 6px; border-radius: 4px; border: 1px solid #334;
                       background: #1a1a2e; color: #eee; font-size: 0.85rem; }
  .water-input label { font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>💧 Water Measurement Demo</h1>
  <span class="badge" id="health-badge">checking...</span>
</header>

<div class="main">
  <div class="canvas-area">
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <div class="sidebar">
    <div class="card">
      <h3>测距结果 / Distance</h3>
      <div class="value" id="dist-value">—</div>
      <div class="meta" id="dist-meta"></div>
    </div>

    <div class="card">
      <h3>诊断信息 / Diagnostics</h3>
      <div id="diag-info">
        <div class="info-row"><span>Confidence</span><span id="d-conf">—</span></div>
        <div class="info-row"><span>Elapsed</span><span id="d-time">—</span></div>
        <div class="info-row"><span>Grazing</span><span id="d-graz">—</span></div>
        <div class="info-row"><span>Status</span><span id="d-stat">—</span></div>
      </div>
    </div>

    <div class="card">
      <h3>水位 / Water Level</h3>
      <div class="water-input">
        <label for="wl-input">h (m):</label>
        <input type="number" id="wl-input" value="0.0" step="0.1">
      </div>
    </div>

    <div class="card">
      <h3>操作</h3>
      <div class="controls">
        <button id="btn-clear">清除选点</button>
        <button class="secondary" id="btn-grid">显示网格</button>
      </div>
      <div class="status" id="status-line">左键点选两点进行测距，右键或点击"清除"重置</div>
    </div>

    <div class="card">
      <h3>说明</h3>
      <div style="font-size:0.8rem; color:#8899bb; line-height:1.5">
        本 Demo 展示单目视觉测距系统的点选测距功能。<br>
        画布模拟 1280×720 相机视野，点选任意两点，系统输出两点在水面参考平面上的实际距离。<br>
        支持实时调整水位参数。
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let points = [];
let showGrid = false;

// Draw background scene (synthetic water surface)
function drawScene() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  sky.addColorStop(0, '#4a7c9b');
  sky.addColorStop(1, '#7bb3cc');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.4);

  // Water surface
  const water = ctx.createLinearGradient(0, H * 0.4, 0, H);
  water.addColorStop(0, '#2a5a6a');
  water.addColorStop(0.5, '#1a4a5a');
  water.addColorStop(1, '#0a3040');
  ctx.fillStyle = water;
  ctx.fillRect(0, H * 0.4, W, H * 0.6);

  // Water ripples
  ctx.strokeStyle = 'rgba(120,200,230,0.15)';
  ctx.lineWidth = 1;
  for (let y = H * 0.42; y < H; y += 18) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 2) {
      const yy = y + Math.sin(x * 0.02 + y * 0.1) * 3;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  // Shore line
  ctx.strokeStyle = 'rgba(180,160,120,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.4);
  ctx.lineTo(W, H * 0.4);
  ctx.stroke();

  // Grid overlay
  if (showGrid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 64) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  // Coordinate hint
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '11px monospace';
  ctx.fillText(`${W}×${H}`, W - 74, H - 8);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawScene();

  // Draw points
  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#e94560' : '#45e9a0';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`P${i+1} (${Math.round(p.x)}, ${Math.round(p.y)})`, p.x + 10, p.y - 8);
  });

  // Draw line between points
  if (points.length === 2) {
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.strokeStyle = '#e9a045';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  if (points.length >= 2) points = [];
  points.push({ x, y });
  draw();

  if (points.length === 2) {
    doMeasure();
  } else {
    document.getElementById('status-line').textContent = '已选第1点，请点选第2点';
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  clearPoints();
});

document.getElementById('btn-clear').addEventListener('click', clearPoints);
document.getElementById('btn-grid').addEventListener('click', () => {
  showGrid = !showGrid;
  draw();
});

function clearPoints() {
  points = [];
  draw();
  document.getElementById('dist-value').textContent = '—';
  document.getElementById('dist-meta').textContent = '';
  document.getElementById('d-conf').textContent = '—';
  document.getElementById('d-time').textContent = '—';
  document.getElementById('d-graz').textContent = '—';
  document.getElementById('d-stat').textContent = '—';
  document.getElementById('status-line').textContent = '左键点选两点进行测距';
}

async function doMeasure() {
  const wl = parseFloat(document.getElementById('wl-input').value) || 0.0;
  document.getElementById('status-line').textContent = '测量中...';

  try {
    const resp = await fetch('/measure', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        point1: { x: points[0].x, y: points[0].y },
        point2: { x: points[1].x, y: points[1].y },
        water_level_m: wl,
      }),
    });
    const data = await resp.json();

    if (data.success && data.distance_m != null) {
      document.getElementById('dist-value').textContent = data.distance_m.toFixed(3) + ' m';
      document.getElementById('dist-meta').textContent = data.message;

      // Draw distance label on canvas
      const mx = (points[0].x + points[1].x) / 2;
      const my = (points[0].y + points[1].y) / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(mx - 50, my - 22, 100, 24);
      ctx.fillStyle = '#e9a045';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(data.distance_m.toFixed(3) + ' m', mx, my - 4);
      ctx.textAlign = 'start';
    } else {
      document.getElementById('dist-value').textContent = 'FAIL';
      document.getElementById('dist-meta').textContent = data.message;
    }

    document.getElementById('d-conf').textContent = data.confidence != null ? data.confidence.toFixed(3) : '—';
    document.getElementById('d-time').textContent = data.elapsed_ms != null ? data.elapsed_ms.toFixed(2) + ' ms' : '—';
    const diag = data.diagnostics || {};
    const graz = diag.grazing;
    document.getElementById('d-graz').textContent = graz ? graz.map(g => g.toFixed(4)).join(', ') : '—';
    document.getElementById('d-stat').textContent = data.message;
    document.getElementById('status-line').textContent = '测距完成，点击"清除"或继续点选';
  } catch (err) {
    document.getElementById('status-line').textContent = '请求失败: ' + err.message;
    document.getElementById('dist-value').textContent = 'ERR';
  }
}

// Health check
async function checkHealth() {
  try {
    const resp = await fetch('/health');
    const data = await resp.json();
    const badge = document.getElementById('health-badge');
    badge.textContent = data.status === 'ok' ? '● Online' : '○ Error';
    badge.style.background = data.status === 'ok' ? '#0a5' : '#a00';
  } catch {
    document.getElementById('health-badge').textContent = '○ Offline';
    document.getElementById('health-badge').style.background = '#a00';
  }
}

draw();
checkHealth();
setInterval(checkHealth, 10000);
</script>
</body>
</html>
